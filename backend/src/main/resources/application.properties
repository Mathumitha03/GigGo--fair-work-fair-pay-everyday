# ===================================================================
# GigGo Application Configuration
# ===================================================================
spring.application.name=giggo-backend
server.port=${PORT:8080}

# Database Configuration (PostgreSQL with PostGIS or H2 In-Memory)
spring.datasource.url=${DB_URL:jdbc:h2:mem:giggodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=GigGoHikariCP

# ===================================================================
# JPA / Hibernate Configuration (PostGIS Spatial Support)
# ===================================================================
#spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# JWT & Security Configuration
# ===================================================================
giggo.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 hours in milliseconds (86400000)
giggo.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# 7 days in milliseconds (604800000)
giggo.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===================================================================
# Swagger / OpenAPI Documentation
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method

# ===================================================================
# Actuator Health & Monitoring
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always