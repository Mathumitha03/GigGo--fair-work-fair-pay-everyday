# ===================================================================
# GigGo Application Configuration
# ===================================================================
spring.application.name=giggo-backend
server.port=${PORT:8080}

# ===================================================================
# Database Configuration (PostgreSQL with PostGIS)
# ===================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:giggo}?reWriteBatchedInserts=true
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=GigGoHikariCP

# ===================================================================
# JPA / Hibernate Configuration (PostGIS Spatial Support)
# ===================================================================
#spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# JWT & Security Configuration
# ===================================================================
giggo.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 hours in milliseconds (86400000)
giggo.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# 7 days in milliseconds (604800000)
giggo.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===================================================================
# Swagger / OpenAPI Documentation
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method

# ===================================================================
# Actuator Health & Monitoring
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===================================================================
# Mail / SMTP Configuration
# ===================================================================
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:admingiggo@gmail.com}
spring.mail.password=${SMTP_PASSWORD:nmox pgjr zlib vmjg}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===================================================================
# Google OAuth2 Client Configuration
# ===================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ===================================================================
# GigGo Email & Password Reset Settings
# ===================================================================
giggo.mail.from=${MAIL_FROM:admingiggo@gmail.com}
giggo.mail.frontend-url=${FRONTEND_URL:http://localhost:5173}
giggo.auth.reset-token-expiration-minutes=${RESET_TOKEN_EXPIRATION_MINUTES:15}